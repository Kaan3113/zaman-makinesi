<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070816">
  <meta name="robots" content="noindex, nofollow">
  <title>Zaman Makinesi</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <canvas id="world"></canvas>

  <!-- 1) Zaman makinesi (giriş) -->
  <section id="intro" class="intro" hidden>
    <p id="introEyebrow" class="eyebrow"></p>
    <div class="tm-wrap"><div id="tmStage" class="tm-stage" role="button" aria-label="Zaman makinesi" tabindex="0"></div></div>
    <div class="intro-bottom">
      <h1 id="introQuestion" class="intro-question"></h1>
      <button id="introBtn" class="btn-primary" type="button"><span id="introBtnText">Hazırım</span><i class="shine"></i></button>
      <p id="introHint" class="intro-hint"></p>
    </div>
  </section>

  <!-- 2) Zaman tüneli -->
  <section id="journey" class="journey" aria-live="polite">
    <button id="jSkip" class="j-skip" type="button">Atla ›</button>
    <div class="j-hud">
      <div id="jDate" class="j-date"></div>
      <div id="jCaption" class="j-caption"></div>
    </div>
  </section>

  <div id="flash" class="flash"></div>

  <!-- 3) Anı sayfaları -->
  <main id="story" class="story" hidden>
    <div id="progress" class="progress"></div>
    <button id="soundBtn" class="icon-btn sound-btn" type="button" aria-label="Sesi aç / kapat">
      <svg class="ic-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg class="ic-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>
    </button>
    <div id="pageHost" class="page-host"></div>
    <nav id="nav" class="nav">
      <button id="prevBtn" class="nav-prev" type="button" aria-label="Önceki sayfa">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button id="nextBtn" class="btn-primary nav-next" type="button"><span id="nextLabel">Devam</span>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg><i class="shine"></i>
      </button>
    </nav>
  </main>

  <canvas id="fx"></canvas>
  <button id="soundPill" class="sound-pill" type="button" hidden>🎧 Müziği başlat</button>
  <div id="fatal" class="fatal" hidden></div>

  <script src="js/store.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/world.js"></script>
  <script src="js/timemachine.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
